<!DOCTYPE html>
<html>
<head>
  <title>Print Test</title>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;">

  <button onclick="printTest()" style="padding:20px 40px;font-size:18px;cursor:pointer;">
    Print Test 🖨️
  </button>

  <script>
    function printTest() {
      fetch('http://localhost:3000/print')
        .then(() => alert('Sent to printer'))
        .catch(() => alert('Error'));
    }
  </script>

</body>
</html>
